[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectdb-search"
version = "0.1.0"
description = "Metadata-index search CLI for plant/manufacturing/construction project documents"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pdfplumber>=0.11",
    "pytesseract>=0.3",
    "pypdfium2>=4.0",
    "Pillow>=10.0",
    "Flask>=3.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "reportlab>=4.0",
]

[project.scripts]
projectdb-search = "projectdb_search.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
projectdb_search = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
