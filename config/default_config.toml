# ProjectDB-Search default configuration.
# Regex patterns are matched case-insensitively against filename + parent
# folder names (at index time) and against the raw query text (at search
# time) via the same rule set — see filename_parser.py / query_parser.py.

[doc_type_patterns]
# Korean synonyms are included alongside the English/abbreviation ones --
# the regex engine and tokenizer are script-agnostic (see
# filename_parser.py's Hangul-aware _TOKEN_SPLIT_RE), so a Korean filename
# matches exactly the same way an English one does. Add more synonyms here
# as you find real naming variants in your corpus -- this is a config
# change, not a code change.
"P&ID" = ["p&id", "p and id", "\\bpid\\b", "배관계장도", "배관\\s*및\\s*계장도"]
"isometric" = ["iso(metric)?", "아이소(메트릭)?", "등각도"]
"memo" = ["memo", "technical note", "\\btn\\b", "메모", "기술\\s*메모"]
"photo" = ["photo", "\\bimg\\b", "\\bpic\\b", "사진"]
"drawing" = ["drawing", "\\bdwg\\b", "도면"]
"datasheet" = ["datasheet", "data sheet", "\\bds\\b", "데이터\\s*시트"]

[project_name_patterns]
# Known project names, matched as literal (case-insensitive) substrings.
#
# *** This list directly controls how much OCR the indexer has to do. ***
# A document only skips the slow PDF-text/OCR fallback pass if BOTH
# project_name and doc_type are identified from the filename/folder alone
# (see indexer/pipeline.py:needs_fallback). If your real project names
# aren't listed here, nearly every document will fall through to OCR and
# indexing will be extremely slow. Run `projectdb-search suggest-projects
# --corpus-root <path>` to get a ready-to-paste list of candidate project
# names from your actual folder structure, then add them below.
#
# The two entries below are development samples for this repo's test
# fixtures -- replace them with your real project names.
"Riverside Plant" = ["riverside\\s*plant", "riverside"]
"Compressor Station" = ["compressor\\s*station"]

[department_patterns]
"Electrical" = ["electrical", "\\belec\\b", "전기"]
"Mechanical" = ["mechanical", "\\bmech\\b", "기계"]
"Civil" = ["civil", "토목"]
"Process" = ["process", "공정"]

[equipment_tag_pattern]
# e.g. P-101A, HX-203, TK-14
regex = "\\b[A-Z]{1,4}-\\d{2,4}[A-Z]?\\b"

[year_pattern]
regex = "\\b(19|20)\\d{2}\\b"

[ranking_weights]
equipment_tag = 40
project_name = 25
doc_type = 15
department = 10
year = 5
keyword = 3

[ranking]
# A candidate's own top score below this is considered weak.
ambiguous_absolute_threshold = 20
# If the top two candidates' scores differ by less than this, it's a close race.
ambiguous_margin = 5
# Cap on how many keyword hits count toward the score (diminishing returns).
max_keyword_hits = 5

[extraction]
# PDF/OCR fallback (Phase 4) is only ever attempted for documents whose
# filename/folder parsing left required fields empty (see
# indexer/pipeline.py:needs_fallback) — never run indiscriminately across
# the whole corpus, to keep indexing time bounded.
#
# A PDF's text layer is trusted only if it yields at least this many
# characters; shorter/empty text is treated as "no usable text layer" and
# triggers OCR instead.
min_text_chars = 20
# DPI used to rasterize PDF pages before OCR (only reached when there's no
# usable text layer, or for image files, which have no text layer at all).
# The actual scale used is capped by ocr_max_side_px below, whichever is
# smaller -- this DPI is only reached on small/normal page sizes.
ocr_dpi = 200
# Only the first N pages of a PDF are ever read during the PDF-text/OCR
# fallback pass. The project/doc-type/tag info this tool needs lives on a
# cover page or title block, not buried on page 80 -- and reading only a
# couple of pages instead of an entire multi-hundred-page manual is one of
# the biggest levers on indexing time.
max_fallback_pages = 2
# Upper bound, in pixels, on the longer side of an image handed to
# Tesseract. Large-format drawings (A0/A1) rasterized at ocr_dpi can exceed
# 30 megapixels, which takes Tesseract tens of seconds per page; capping
# the side length keeps OCR time roughly bounded regardless of the
# original drawing's paper size, with no meaningful accuracy loss for the
# cover-page/title-block text this tool looks for.
ocr_max_side_px = 2400
# Number of documents processed in parallel during the deep-scan (PDF-text/
# OCR fallback) pass. 0 = auto (min(CPU count, 4)).
deep_scan_workers = 0
# Tesseract's mean word confidence (0-100, normalized to 0.0-1.0 here) must
# meet this bar for OCR output to be merged into the index. Below it, the
# document keeps its filename-only metadata, is marked "needs_review", and
# is logged to the manual review queue instead of blocking the pipeline.
ocr_confidence_threshold = 0.55
# Only these formats get PDF-text/OCR fallback. Office formats (Word/Excel/
# PowerPoint) are intentionally excluded: many are internal
# security-restricted files, and this project only ever wants "which
# document/section" pointers, not content extraction from those formats.
pdf_extensions = [".pdf"]
image_extensions = [".jpg", ".jpeg", ".png", ".tif", ".tiff"]
# "Open file" 버튼이 실제로 이 파일들을 브라우저를 통해 여는(HTTP로 바이트
# 전송) 방식이 정상 동작하는 확장자 목록. 그 외 확장자는 "Open file" 링크
# 자체를 숨기고 "Show in folder"만 보여준다 -- 사내 문서보안(DRM)
# 솔루션이 탐색기에서 직접 여는 것만 인식하고, 브라우저가 다운로드
# 폴더에 만든 별도 사본은 열기를 거부하는 경우가 많기 때문이다(실사용
# 테스트로 확인됨). 어떤 확장자가 실제로 막히는지는 회사 보안 정책에
# 따라 다르므로, 실사용 결과에 맞게 이 목록을 조정하면 된다.
direct_open_extensions = [".pdf", ".jpg", ".jpeg", ".png", ".tif", ".tiff", ".hwpx"]

[llm]
# Empty by default -> NoOpBackend is selected, tool works fully offline.
# Set api_key + base_url later to point at an Anthropic-compatible endpoint
# (e.g. an internal Claude Enterprise gateway) with no code changes required.
api_key = ""
base_url = ""
model = ""
