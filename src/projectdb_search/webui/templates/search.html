{% extends "base.html" %}
{% block content %}
<form method="post" action="/search" class="search-form">
  <input
    type="text" name="query" class="search-input" autocomplete="off" autofocus
    placeholder="e.g. isometric drawing for HX-203"
    value="{{ query or '' }}"
  >
  <button type="submit" class="search-button">Search</button>
</form>

{% if results is not none %}
  {% include "results.html" %}
{% endif %}
{% endblock %}
